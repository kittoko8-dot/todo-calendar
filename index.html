<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToDoカレンダー</title>
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: one-screen phone app — sticky top bar, scrolling view, fixed bottom tab bar, floating add button */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#E9EDEB; --fg:#1C2422; --muted:#66716D; --line:#D9DFDC;
  --accent:#2D6B5E; --accent-fg:#FFFFFF; --accent-soft:#DCEBE6;
  --hi:#D2461E; --mid:#D99A00; --lo:#5E86A8;
  --sun:#C8372D; --sat:#2F67B1; --today:#2D6B5E;
  --ev1:#2D6B5E; --ev2:#3A72C4; --ev3:#C4476E; --ev4:#C98A12; --ev5:#7B5CC0;
  --shadow:0 6px 24px rgba(20,40,34,.14);
  --font-body:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",system-ui,sans-serif;
  --font-num:system-ui,"Roboto","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1B2320; --surface-2:#25302C; --fg:#E6ECE9; --muted:#97A39F; --line:#2E3A36;
  --accent:#5DB7A2; --accent-fg:#0E1714; --accent-soft:#1F3631;
  --hi:#F06A43; --mid:#F0B931; --lo:#82A9CB; --sun:#F07368; --sat:#76A6EC; --today:#5DB7A2;
  --ev1:#3E8E7C; --ev2:#4F86D6; --ev3:#CF5C82; --ev4:#C99325; --ev5:#8C70D0;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1B2320; --surface-2:#25302C; --fg:#E6ECE9; --muted:#97A39F; --line:#2E3A36;
  --accent:#5DB7A2; --accent-fg:#0E1714; --accent-soft:#1F3631;
  --hi:#F06A43; --mid:#F0B931; --lo:#82A9CB; --sun:#F07368; --sat:#76A6EC; --today:#5DB7A2;
  --ev1:#3E8E7C; --ev2:#4F86D6; --ev3:#CF5C82; --ev4:#C99325; --ev5:#8C70D0;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:12px 8px;min-height:56px}
.top h1{font-size:22px;font-weight:700;margin:0;letter-spacing:.02em;flex:1;min-width:0;text-wrap:balance}
.top h1 .num{font-family:var(--font-num);font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--fg);display:grid;place-items:center;font-size:20px;line-height:1}
.pillbtn{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.note{font-size:12px;color:var(--muted);padding:0 0 6px}
.note.bk{border:0;background:none;display:flex;align-items:center;gap:6px;text-align:left;width:100%}
.note.bk::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.note.bk.ok::before{background:var(--accent)}
.note.bk.warn::before{background:var(--mid)}
.note.bk.err{color:var(--hi)} .note.bk.err::before{background:var(--hi)}
.sect{font-size:13px;font-weight:700;margin:18px 0 8px;color:var(--fg)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{flex:1;min-width:130px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.arm{background:var(--hi);border-color:var(--hi);color:#fff}
.stat{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px;white-space:pre-line}
.steps{font-size:12.5px;color:var(--muted);padding-left:1.2em;margin:4px 0 0}
.steps li{margin-bottom:3px}

main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* ---- Todo ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:14px;display:flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .cnt{font-family:var(--font-num);color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] .cnt{color:inherit;opacity:.7}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:stretch;background:var(--surface);border-radius:12px;overflow:hidden;min-height:58px}
.item .stripe{width:5px;flex:none}
.item .check{flex:none;width:52px;border:0;background:none;display:grid;place-items:center}
.item .check span{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:14px;color:transparent}
.item.done .check span{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.item .body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:9px 12px 9px 0}
.item .title{font-size:15.5px;font-weight:500;word-break:break-word}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);margin-top:2px;align-items:center}
.meta .num{font-family:var(--font-num)}
.pri{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;color:#fff;letter-spacing:.05em}
.pri-3{background:var(--hi)} .pri-2{background:var(--mid);color:#2A1E00} .pri-1{background:var(--lo)}
.st-3{background:var(--hi)} .st-2{background:var(--mid)} .st-1{background:var(--lo)}
.overdue{color:var(--hi);font-weight:700}
.duetoday{color:var(--mid);font-weight:700}

details.sec{margin-top:20px}
details.sec summary{list-style:none;font-size:13.5px;font-weight:700;color:var(--muted);padding:8px 2px;display:flex;align-items:center;gap:6px;cursor:pointer}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::before{content:"▸";transition:transform .15s}
details.sec[open] summary::before{transform:rotate(90deg)}
details.sec .list{margin-top:4px}
.item.later{opacity:.8}

.empty{background:var(--surface);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* ---- Calendar ---- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--muted);text-align:center;padding-block:4px}
.wk .s{color:var(--sun)} .wk .t{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);touch-action:pan-y}
.cell{background:var(--surface);min-height:76px;border:0;padding:3px 2px 2px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.cell.out{background:var(--surface-2)}
.cell.out .dn{opacity:.45}
.cell .dn{font-family:var(--font-num);font-size:13px;font-weight:500;width:24px;height:22px;display:grid;place-items:center;border-radius:11px;margin:0 auto 1px}
.cell.sun .dn,.cell.hol .dn{color:var(--sun)} .cell.sat .dn{color:var(--sat)}
.cell.today .dn{background:var(--today);color:var(--accent-fg)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ev{font-size:10px;line-height:1.3;border-radius:3px;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:clip;color:#fff;font-weight:500;letter-spacing:-.02em}
/* label too long even at the smallest size: allow two lines */
.ev.w2{white-space:normal;word-break:break-all;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev.todo{background:transparent;color:var(--fg);border-left:3px solid var(--lo);border-radius:0;padding-left:2px}
.ev.todo.p3{border-color:var(--hi)} .ev.todo.p2{border-color:var(--mid)}
.sqs{margin-top:auto;display:flex;flex-wrap:wrap;gap:2px;padding:2px 2px 1px;align-items:center}
.q{display:block;width:9px;height:9px;border-radius:1.5px}
.qd{background:var(--muted);opacity:.7}
.more{font-size:10px;color:var(--muted);padding-left:3px;font-family:var(--font-num)}

.day{margin-top:14px}
.day h2{font-size:16px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.day h2 .num{font-family:var(--font-num)}
.day h2 .hn{font-size:12.5px;color:var(--sun);font-weight:500}
.evrow{display:flex;gap:12px;background:var(--surface);border-radius:12px;padding:10px 12px;border:0;text-align:left;width:100%;align-items:flex-start}
.evrow .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.evrow .time{font-family:var(--font-num);font-size:13px;color:var(--muted);width:46px;flex:none;line-height:1.35;padding-top:2px}
.evrow .tt{flex:1;min-width:0;word-break:break-word;font-weight:500}
.evrow .memo{font-size:12.5px;color:var(--muted);font-weight:400;white-space:pre-wrap}

/* ---- Bottom tabs & FAB ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.tab{border:0;background:none;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent)}
.fab{position:fixed;z-index:7;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:32px;line-height:1;box-shadow:var(--shadow);display:grid;place-items:center}

/* ---- Sheet ---- */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sheethead h3{margin:0;font-size:17px}
.txtbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:15px;padding:8px 4px}
.txtbtn.muted{color:var(--muted);font-weight:500}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lbl{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.inp{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
textarea.inp{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button .dot{width:10px;height:10px;border-radius:50%}
.seg button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);background:var(--surface-2)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.hint{font-size:12px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;height:46px;padding:0 12px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.swatches{display:flex;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.danger{width:100%;height:46px;border-radius:10px;border:1px solid var(--hi);background:transparent;color:var(--hi);font-weight:700;margin-top:6px}
.danger.arm{background:var(--hi);color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
</style>

<header class="top">
  <div class="wrap">
    <button class="iconbtn" id="prevM" aria-label="前の月" hidden>‹</button>
    <h1 id="ttl">Todo</h1>
    <button class="iconbtn" id="nextM" aria-label="次の月" hidden>›</button>
    <button class="pillbtn" id="todayBtn" hidden>今日</button>
    <button class="iconbtn" id="setBtn" aria-label="バックアップと設定"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 10a4 4 0 0 1-.5 7.97"/><path d="M12 12v8M9 15l3-3 3 3"/></svg></button>
  </div>
  <div class="wrap"><button class="note bk" id="note"></button></div>
</header>

<main>
  <section id="vTodo" class="wrap"></section>
  <section id="vCal" hidden>
    <div class="wrap" style="padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))">
      <div class="wk"><div class="s">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="t">土</div></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="wrap"><div class="day" id="day"></div></div>
  </section>
</main>

<button class="fab" id="fab" aria-label="追加">＋</button>

<nav class="tabs" role="tablist">
  <div class="in">
    <button class="tab" role="tab" id="tabTodo" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>
      Todo
    </button>
    <button class="tab" role="tab" id="tabCal" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      カレンダー
    </button>
  </div>
</nav>

<div class="backdrop" id="backdrop" hidden><form class="sheet" id="sheet" autocomplete="off"></form></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const p2 = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const DOW = '日月火水木金土';
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const today = () => ymd(new Date());
const PRI = {3:'高',2:'中',1:'低'};
const PRIVAR = {3:'--hi',2:'--mid',1:'--lo'};
const EVCOL = ['ev1','ev2','ev3','ev4','ev5'];

const HOL = {
 '2026-01-01':'元日','2026-01-12':'成人の日','2026-02-11':'建国記念の日','2026-02-23':'天皇誕生日','2026-03-20':'春分の日','2026-04-29':'昭和の日','2026-05-03':'憲法記念日','2026-05-04':'みどりの日','2026-05-05':'こどもの日','2026-05-06':'振替休日','2026-07-20':'海の日','2026-08-11':'山の日','2026-09-21':'敬老の日','2026-09-22':'国民の休日','2026-09-23':'秋分の日','2026-10-12':'スポーツの日','2026-11-03':'文化の日','2026-11-23':'勤労感謝の日',
 '2027-01-01':'元日','2027-01-11':'成人の日','2027-02-11':'建国記念の日','2027-02-23':'天皇誕生日','2027-03-21':'春分の日','2027-03-22':'振替休日','2027-04-29':'昭和の日','2027-05-03':'憲法記念日','2027-05-04':'みどりの日','2027-05-05':'こどもの日','2027-07-19':'海の日','2027-08-11':'山の日','2027-09-20':'敬老の日','2027-09-23':'秋分の日','2027-10-11':'スポーツの日','2027-11-03':'文化の日','2027-11-23':'勤労感謝の日'
};

const now = new Date();
const S = {
  todos: [], events: [], loaded: false,
  tab: 'todo', filter: 'all',
  month: new Date(now.getFullYear(), now.getMonth(), 1),
  sel: today(),
};
try { const t = localStorage.getItem('tc-tab'); if (t === 'cal' || t === 'todo') S.tab = t; } catch(e) {}

/* ---------- storage backends ---------- */
let backend = null;
const LKEY = 'tc-data-v1';
function persist(){
  try { localStorage.setItem(LKEY, JSON.stringify({todos:S.todos, events:S.events})); }
  catch(e) { toast('端末に保存できませんでした（空き容量を確認してください）'); }
}
function localBackend(){
  let data = {todos:[], events:[]};
  try { const raw = localStorage.getItem(LKEY); if (raw) data = JSON.parse(raw); } catch(e) {}
  S.todos = data.todos || []; S.events = data.events || []; S.loaded = true;
  return {
    async save(kind, item){ const arr = S[kind]; const i = arr.findIndex(x => x.id === item.id); if (i >= 0) arr[i] = item; else arr.push(item); persist(); markChanged(); render(); },
    async remove(kind, id){ S[kind] = S[kind].filter(x => x.id !== id); persist(); markChanged(); render(); }
  };
}

/* ---------- automatic backup to a private GitHub repository ---------- */
const CFGKEY = 'tc-backup-cfg', STKEY = 'tc-backup-state', BFILE = 'todo-calendar-backup.json';
const loadJ = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e) { return d; } };
const saveJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
let BC = loadJ(CFGKEY, {owner:'', repo:'todo-backup', token:''});
let BS = loadJ(STKEY, {changedAt:0, backedAt:0, lastErr:''});
let bkBusy = false, bkTimer = null;
const configured = () => !!(BC.owner && BC.repo && BC.token);
const isDirty = () => BS.changedAt > BS.backedAt;
const hm = t => { const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };

function markChanged(){ BS.changedAt = Date.now(); saveJ(STKEY, BS); scheduleBackup(15000); renderBk(); }
function scheduleBackup(ms){
  clearTimeout(bkTimer);
  if (!configured() || !isDirty()) return;
  bkTimer = setTimeout(() => backupNow(false), ms);
}
function b64enc(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function ghFetch(opts){
  return fetch(`https://api.github.com/repos/${encodeURIComponent(BC.owner)}/${encodeURIComponent(BC.repo)}/contents/${BFILE}`, Object.assign({cache:'no-store'}, opts, {
    headers: Object.assign({Authorization: 'Bearer ' + BC.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, (opts && opts.headers) || {})
  }));
}
function ghErr(r){
  if (r.status === 401) return 'トークンが無効か期限切れです';
  if (r.status === 403) return 'トークンにこのリポジトリへの書き込み権限がありません';
  if (r.status === 404) return 'リポジトリが見つかりません（ユーザー名・リポジトリ名・トークンの対象を確認）';
  if (r.status === 409 || r.status === 422) return '同時に保存がぶつかりました。少し後に再試行します';
  return 'GitHubエラー（' + r.status + '）';
}
async function backupNow(manual){
  if (!configured()) { if (manual) toast('先にバックアップ先を設定してください'); return false; }
  if (!navigator.onLine) { if (manual) toast('オフラインです。電波のある場所で自動的にバックアップします'); renderBk(); return false; }
  if (bkBusy) return false;
  bkBusy = true; renderBk();
  const started = Date.now();
  try {
    let sha;
    const cur = await ghFetch({method:'GET'});
    if (cur.ok) sha = (await cur.json()).sha;
    else if (cur.status !== 404) throw new Error(ghErr(cur));
    const snap = {app:'todo-calendar', format:1, savedAt:new Date().toISOString(), todos:S.todos, events:S.events};
    const put = await ghFetch({method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:'バックアップ ' + hm(started), content: b64enc(JSON.stringify(snap, null, 1)), sha})});
    if (!put.ok) {
      if (cur.status === 404 && put.status === 404) throw new Error(ghErr(put));
      throw new Error(ghErr(put));
    }
    BS.backedAt = started; BS.lastOkAt = Date.now(); BS.lastErr = '';
    if (manual) toast('バックアップしました');
    return true;
  } catch(e) {
    BS.lastErr = (e && e.message && !/fetch/i.test(e.message)) ? e.message : '通信できませんでした。後で自動的に再試行します';
    if (manual) toast(BS.lastErr);
    return false;
  } finally {
    bkBusy = false; saveJ(STKEY, BS); renderBk();
    if (isDirty()) scheduleBackup(BS.lastErr ? 120000 : 5000);
  }
}
async function restoreFromBackup(){
  if (!configured()) { toast('先にバックアップ先を設定してください'); return; }
  if (!navigator.onLine) { toast('オフラインでは復元できません'); return; }
  try {
    const r = await ghFetch({method:'GET', headers:{Accept:'application/vnd.github.raw+json'}});
    if (!r.ok) { toast(r.status === 404 ? 'まだバックアップがありません' : ghErr(r)); return; }
    applyImport(await r.json(), true);
  } catch(e) { toast('復元できませんでした'); }
}
function applyImport(d, fromBackup){
  if (!d || !Array.isArray(d.todos) || !Array.isArray(d.events)) { toast('このファイルは読み込めません'); return; }
  S.todos = d.todos; S.events = d.events; persist();
  if (fromBackup) { BS.changedAt = BS.backedAt = Date.now(); BS.lastErr = ''; saveJ(STKEY, BS); }
  else markChanged();
  render(); renderBk(); closeSheet();
  toast(`復元しました（Todo ${d.todos.length}件・予定 ${d.events.length}件）`);
}
function renderBk(){
  const n = $('#note'); if (!n) return;
  let t, c = '';
  if (!configured()) { t = '自動バックアップ未設定（タップして設定）'; c = 'warn'; }
  else if (bkBusy) { t = 'バックアップ中…'; }
  else if (!navigator.onLine) { t = 'オフライン' + (isDirty() ? '：電波が戻ったら自動でバックアップします' : '（バックアップ済み）'); c = isDirty() ? 'warn' : 'ok'; }
  else if (BS.lastErr && isDirty()) { t = 'バックアップ失敗：' + BS.lastErr; c = 'err'; }
  else if (isDirty()) { t = 'まもなく自動バックアップします'; c = 'warn'; }
  else { t = BS.lastOkAt ? hm(BS.lastOkAt) + ' にバックアップ済み' : 'バックアップ済み'; c = 'ok'; }
  n.textContent = t; n.className = 'note bk ' + c;
  const st = $('#bk-stat');
  if (st) st.textContent = t + (BS.lastOkAt ? '\n最終成功：' + hm(BS.lastOkAt) : '');
}

function dueLabel(t){
  if (!t.due) return '';

  if (!t.done && t.due < td) return `<span class="overdue">期限 <span class="num">${md(t.due)}</span> 超過</span>`;
  if (!t.done && t.due === td) return `<span class="duetoday">今日まで</span>`;
  return `<span>期限 <span class="num">${md(t.due)}</span></span>`;
}
function sortTodos(a,b){
  return (b.priority||1)-(a.priority||1)
    || ((a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : 0)
    || (a.created||0)-(b.created||0);
}
function todoItem(t, extra){
  const p = t.priority || 1;
  return `<div class="item${t.done?' done':''}${extra==='later'?' later':''}">
    <span class="stripe st-${p}"></span>
    <button class="check" data-check="${t.id}" aria-label="${t.done?'未完了に戻す':'完了にする'}"><span>✓</span></button>

/* ---------- Todo view ---------- */
function renderTodo(){
  const td = today();
  const open = S.todos.filter(t => !t.done);
  const active = open.filter(t => !t.showFrom || t.showFrom <= td);
  const later = open.filter(t => t.showFrom && t.showFrom > td).sort((a,b)=> a.showFrom < b.showFrom ? -1 : a.showFrom > b.showFrom ? 1 : sortTodos(a,b));
  const done = S.todos.filter(t => t.done).sort((a,b)=> (b.doneAt||0)-(a.doneAt||0));
  const f = S.filter;
  const pass = t => f === 'all' || String(t.priority||1) === f;
  const cnt = k => active.filter(t => k === 'all' || String(t.priority||1) === k).length;
  const chip = (k, label, dotVar) => `<button class="chip" data-filter="${k}" aria-pressed="${f===k}">${dotVar?`<span class="dot" style="background:var(${dotVar})"></span>`:''}${label}<span class="cnt">${cnt(k)}</span></button>`;
  const shown = active.filter(pass).sort(sortTodos);
  let h = `<div class="chips">${chip('all','すべて')}${chip('3','高','--hi')}${chip('2','中','--mid')}${chip('1','低','--lo')}</div>`;
  if (!S.loaded) h += `<div class="empty">読み込み中…</div>`;
  else if (!shown.length) h += `<div class="empty"><strong>${active.length ? 'この重要度のTodoはありません' : '今日やることはありません'}</strong>右下の ＋ からTodoを追加できます。重要度と、いつから表示するかを選べます。</div>`;
  else h += `<div class="list">${shown.map(t => todoItem(t)).join('')}</div>`;
  const laterF = later.filter(pass);
  if (laterF.length) h += `<details class="sec" id="secLater"><summary>これから表示されるTodo（${laterF.length}）</summary><div class="list">${laterF.map(t => todoItem(t,'later')).join('')}</div></details>`;
  if (done.length) h += `<details class="sec" id="secDone"><summary>完了済み（${done.length}）</summary><div class="list">${done.slice(0,50).map(t => todoItem(t)).join('')}</div></details>`;
  const v = $('#vTodo');
  const openState = { l: $('#secLater')?.open, d: $('#secDone')?.open };
  v.innerHTML = h;
  if (openState.l && $('#secLater')) $('#secLater').open = true;
  if (openState.d && $('#secDone')) $('#secDone').open = true;
}

/* ---------- Calendar view ---------- */
function eventsOn(d){
  return S.events.filter(e => e.date === d || (e.endDate && e.date <= d && d <= e.endDate))
    .sort((a,b) => (b.allDay?1:0)-(a.allDay?1:0) || (a.start||'').localeCompare(b.start||'') || (a.created||0)-(b.created||0));
}
function todosDue(d){ return S.todos.filter(t => !t.done && t.due === d).sort(sortTodos); }
// Todos that belong to day d: open ones from their display date through their deadline
// (no deadline: through today), and finished ones on the day they were completed.
function todosOn(d){
  const td = today();
  const open = S.todos.filter(t => {
    if (t.done) return false;
    const from = t.showFrom || ymd(new Date(t.created || Date.now()));
    let to = t.due || (from > td ? from : td);
    if (to < from) to = from;
    return from <= d && d <= to;
  }).sort(sortTodos);
  const done = S.todos.filter(t => t.done && t.doneAt && ymd(new Date(t.doneAt)) === d);
  return {open, done};
}

function renderCal(){
  const y = S.month.getFullYear(), m = S.month.getMonth();
  const first = new Date(y, m, 1);
  const start = new Date(y, m, 1 - first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(y, m+1, 0).getDate()) / 7);
  const td = today();
  let h = '';
  for (let i = 0; i < weeks*7; i++){
    const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    const d = ymd(dt);
    const cls = ['cell'];
    if (dt.getMonth() !== m) cls.push('out');
    if (dt.getDay() === 0) cls.push('sun'); if (dt.getDay() === 6) cls.push('sat');
    if (HOL[d]) cls.push('hol');
    if (d === td) cls.push('today');
    if (d === S.sel) cls.push('sel');
    const evs = eventsOn(d), to = todosOn(d);
    const marks = [];
    if (HOL[d]) marks.push(`<div class="ev" style="background:transparent;color:var(--sun);padding:0 1px">${esc(HOL[d])}</div>`);
    evs.forEach(e => marks.push(`<div class="ev" style="background:var(--${e.color||'ev1'})">${esc(e.title)}</div>`));
    const maxShow = 3;
    const vis = marks.length > maxShow ? marks.slice(0, maxShow-1) : marks;
    const sq = to.open.map(t => `<i class="q st-${t.priority||1}"></i>`).concat(to.done.map(() => '<i class="q qd"></i>'));
    const sqMax = 12;
    const sqHtml = sq.length ? `<span class="sqs">${sq.slice(0, sqMax).join('')}${sq.length > sqMax ? `<span class="more">+${sq.length-sqMax}</span>` : ''}</span>` : '';
    h += `<button class="${cls.join(' ')}" data-day="${d}" aria-label="${dt.getMonth()+1}月${dt.getDate()}日"><span class="dn">${dt.getDate()}</span>${vis.join('')}${marks.length > maxShow ? `<span class="more">+${marks.length-maxShow+1}</span>` : ''}${sqHtml}</button>`;
  }
  $('#grid').innerHTML = h;
  fitLabels();

  const sd = parse(S.sel);
  const evs = eventsOn(S.sel), dto = todosOn(S.sel), tds = dto.open.concat(dto.done);
  let dh = `<h2><span><span class="num">${sd.getMonth()+1}</span>月<span class="num">${sd.getDate()}</span>日（${DOW[sd.getDay()]}）</span>${HOL[S.sel]?`<span class="hn">${esc(HOL[S.sel])}</span>`:''}</h2>`;
  if (!evs.length && !tds.length) dh += `<div class="empty">予定はありません。＋ でこの日に予定を追加できます。</div>`;
  else {
    dh += '<div class="list">';
    evs.forEach(e => {
      const multi = e.endDate && e.endDate !== e.date;
      const time = e.allDay ? '終日' : `${e.start||''}${e.end?'<br>'+e.end:''}`;
      dh += `<button class="evrow" data-edit-ev="${e.id}"><span class="bar" style="background:var(--${e.color||'ev1'})"></span><span class="time">${time}</span><span class="tt">${esc(e.title)}${multi?`<div class="memo">${md(e.date)} 〜 ${md(e.endDate)}</div>`:''}${e.memo?`<div class="memo">${esc(e.memo)}</div>`:''}</span></button>`;
    });
    tds.forEach(t => {
      const sub = t.done ? '完了' : `重要度 ${PRI[t.priority||1]}${t.due ? '・期限 ' + md(t.due) : ''}`;
      dh += `<button class="evrow" data-edit-todo="${t.id}"><span class="bar ${t.done ? 'qd' : 'st-' + (t.priority||1)}"></span><span class="time">Todo</span><span class="tt"${t.done ? ' style="text-decoration:line-through;color:var(--muted)"' : ''}>${esc(t.title)}<div class="memo">${sub}</div></span></button>`;
    });
    dh += '</div>';
  }
  $('#day').innerHTML = dh;
}

// Shrink each calendar label until its whole text fits the cell width (10px → 7px).
// If it still doesn't fit, wrap it onto two lines and shrink again (9px → 6.5px).
function fitLabels(){
  const els = document.querySelectorAll('#grid .ev');
  els.forEach(el => {
    el.classList.remove('w2'); el.style.fontSize = '';
    let fs = 10;
    while (el.scrollWidth > el.clientWidth + 0.5 && fs > 7) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
    if (el.scrollWidth > el.clientWidth + 0.5) {
      el.classList.add('w2');
      for (const lines of [2, 3]) {
        el.style.webkitLineClamp = lines;
        fs = 9; el.style.fontSize = fs + 'px';
        while (el.scrollHeight > el.clientHeight + 0.5 && fs > 6.5) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
        if (el.scrollHeight <= el.clientHeight + 0.5) break;
      }
    } else el.style.webkitLineClamp = '';
  });
}

    <div class="sheethead"><button type="button" class="txtbtn muted" id="f-cancel">キャンセル</button><h3>${isNew?'Todoを追加':'Todoを編集'}</h3><button type="submit" class="txtbtn" id="f-save">保存</button></div>
    <div class="field"><label for="f-title">内容</label><input class="inp" id="f-title" maxlength="200" placeholder="例：紹介状を書く" value="${esc(v.title)}"></div>
    <div class="field"><span class="lbl">重要度</span><div class="seg" id="f-pri">
      ${[3,2,1].map(p => `<button type="button" data-p="${p}" aria-pressed="${v.priority===p}"><span class="dot" style="background:var(${PRIVAR[p]})"></span>${PRI[p]}</button>`).join('')}
    </div></div>
    <div class="field"><label for="f-from">いつから表示するか</label><input class="inp" type="date" id="f-from" value="${esc(v.showFrom||'')}">
      <div class="quick" id="f-fromq"><button type="button" data-o="0">今日</button><button type="button" data-o="1">明日</button><button type="button" data-o="7">1週間後</button><button type="button" data-o="30">1か月後</button></div>
      <span class="hint">この日になるまでTodo一覧には出ず、「これから表示」にまとまります。</span></div>
    <div class="field"><label for="f-due">期限（任意）</label><input class="inp" type="date" id="f-due" value="${esc(v.due||'')}"><span class="hint">期限を入れるとカレンダーにも表示されます。</span></div>
    <div class="field"><label for="f-memo">メモ（任意）</label><textarea class="inp" id="f-memo" maxlength="2000">${esc(v.memo||'')}</textarea></div>
    ${isNew ? '' : '<button type="button" class="danger" id="f-del">削除</button>'}`;
  let pri = v.priority || 2;
  sheet.querySelectorAll('#f-pri button').forEach(b => b.onclick = () => { pri = +b.dataset.p; sheet.querySelectorAll('#f-pri button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  sheet.querySelectorAll('#f-fromq button').forEach(b => b.onclick = () => { $('#f-from').value = addDays(today(), +b.dataset.o); });
  $('#f-cancel').onclick = closeSheet;
  if (!isNew) armDelete($('#f-del'), () => backend.remove('todos', t.id));
  sheet.onsubmit = e => {
    e.preventDefault();
    const title = $('#f-title').value.trim();
    if (!title) { $('#f-title').focus(); toast('内容を入力してください'); return; }
    const item = Object.assign(v, { id: v.id || newId(), title, priority: pri, showFrom: $('#f-from').value || today(), due: $('#f-due').value || '', memo: $('#f-memo').value.trim(), done: !!v.done, created: v.created || Date.now() });
    backend.save('todos', item);
    closeSheet();
    if (item.showFrom > today()) toast(`${md(item.showFrom)}から表示されます`);
  };
  backdrop.hidden = false;
  if (isNew) setTimeout(() => $('#f-title')?.focus(), 50);
}

function openEvent(e){
  if (!backend) return;
  const isNew = !e;
  const v = e ? Object.assign({}, e) : {title:'', date:S.sel, endDate:'', allDay:false, start:'09:00', end:'10:00', color:'ev1', memo:''};
  sheet.innerHTML = `
    <div class="grab"></div>
    <div class="sheethead"><button type="button" class="txtbtn muted" id="f-cancel">キャンセル</button><h3>${isNew?'予定を追加':'予定を編集'}</h3><button type="submit" class="txtbtn" id="f-save">保存</button></div>
    <div class="field"><label for="f-title">タイトル</label><input class="inp" id="f-title" maxlength="200" placeholder="例：外来、学会、会議" value="${esc(v.title)}"></div>
    <div class="field"><label class="toggle" for="f-allday">終日<input type="checkbox" id="f-allday" ${v.allDay?'checked':''}></label></div>
    <div class="row"><div class="field"><label for="f-date">開始日</label><input class="inp" type="date" id="f-date" value="${esc(v.date)}"></div>
      <div class="field"><label for="f-end-date">終了日（任意）</label><input class="inp" type="date" id="f-end-date" value="${esc(v.endDate||'')}"></div></div>
    <div class="row" id="f-times"><div class="field"><label for="f-start">開始</label><input class="inp" type="time" id="f-start" value="${esc(v.start||'')}"></div>
      <div class="field"><label for="f-end">終了</label><input class="inp" type="time" id="f-end" value="${esc(v.end||'')}"></div></div>
    <div class="field"><span class="lbl">色</span><div class="swatches" id="f-color">${EVCOL.map(c => `<button type="button" data-c="${c}" style="background:var(--${c})" aria-label="色 ${c}" aria-pressed="${v.color===c}"></button>`).join('')}</div></div>
    <div class="field"><label for="f-memo">メモ（任意）</label><textarea class="inp" id="f-memo" maxlength="2000">${esc(v.memo||'')}</textarea></div>
    ${isNew ? '' : '<button type="button" class="danger" id="f-del">削除</button>'}`;
  let color = v.color || 'ev1';
  sheet.querySelectorAll('#f-color button').forEach(b => b.onclick = () => { color = b.dataset.c; sheet.querySelectorAll('#f-color button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  const syncTimes = () => { $('#f-times').hidden = $('#f-allday').checked; };
  $('#f-allday').onchange = syncTimes; syncTimes();
  $('#f-cancel').onclick = closeSheet;
  if (!isNew) armDelete($('#f-del'), () => backend.remove('events', e.id));
  sheet.onsubmit = ev => {
    ev.preventDefault();
    const title = $('#f-title').value.trim();
    if (!title) { $('#f-title').focus(); toast('タイトルを入力してください'); return; }
    const date = $('#f-date').value || S.sel;
    let endDate = $('#f-end-date').value || '';
    if (endDate && endDate <= date) endDate = '';
    const allDay = $('#f-allday').checked;
    const item = Object.assign(v, { id: v.id || newId(), title, date, endDate, allDay, start: allDay ? '' : $('#f-start').value, end: allDay ? '' : $('#f-end').value, color, memo: $('#f-memo').value.trim(), created: v.created || Date.now() });
    backend.save('events', item);
    S.sel = date; const dt = parse(date); S.month = new Date(dt.getFullYear(), dt.getMonth(), 1);
    closeSheet(); render();
  };
  backdrop.hidden = false;
  if (isNew) setTimeout(() => $('#f-title')?.focus(), 50);
}

// re-render when the date rolls over (e.g. app left open overnight)
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });

initStore();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
